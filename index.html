



<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock Register</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#060913">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  /* Apple Duo-Tone Palette: Ocean Blue + Sunset Coral */
  --c-duo1: #0A84FF;
  --c-duo2: #FF5E3A;

  /* Dark Theme (Default) - Apple Midnight Liquid Glass */
  --bg: #060913;
  --card: rgba(22, 30, 48, 0.48);
  --card-sub: rgba(255, 255, 255, 0.08);
  --modal-bg: rgba(18, 25, 42, 0.78);
  --tx: #F5F7FA;
  --mut: #9BA5B8;
  --ac: #0A84FF;
  --ac-2: #FF5E3A;
  --ac-light: rgba(10, 132, 255, 0.18);
  --bd: rgba(255, 255, 255, 0.18);
  --bd-top: rgba(255, 255, 255, 0.34);
  --bad: #FF453A;
  --bad-light: rgba(255, 69, 58, 0.18);
  --jm: #30D158;
  --jm-light: rgba(48, 209, 88, 0.18);

  /* Apple Liquid Glass Shadows & Highlights */
  --sh: 0 16px 40px -8px rgba(0, 0, 0, 0.52), inset 0 1px 0 0 var(--bd-top);
  --sh-sm: 0 4px 14px rgba(0, 0, 0, 0.25), inset 0 1px 0 0 rgba(255, 255, 255, 0.2);
  --radius: 24px;
  --grad: linear-gradient(135deg, #0A84FF 0%, #FF5E3A 100%);
  --glass-blur: blur(28px) saturate(190%);
  --spring: cubic-bezier(0.22, 1, 0.36, 1);
}

/* Light Theme - Apple Frosted Daylight Glass */
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg: #EDF2F8;
    --card: rgba(255, 255, 255, 0.60);
    --card-sub: rgba(255, 255, 255, 0.58);
    --modal-bg: rgba(248, 250, 254, 0.84);
    --tx: #0F172A;
    --mut: #5A657A;
    --ac: #007AFF;
    --ac-2: #FF4F28;
    --ac-light: rgba(0, 122, 255, 0.14);
    --bd: rgba(15, 23, 42, 0.09);
    --bd-top: rgba(255, 255, 255, 0.92);
    --bad: #FF3B30;
    --bad-light: rgba(255, 59, 48, 0.14);
    --jm: #16A34A;
    --jm-light: rgba(22, 163, 74, 0.14);
    --sh: 0 14px 36px -8px rgba(15, 23, 42, 0.10), inset 0 1.5px 0 0 var(--bd-top);
    --sh-sm: 0 4px 12px rgba(15, 23, 42, 0.06), inset 0 1px 0 0 rgba(255, 255, 255, 0.85);
    --grad: linear-gradient(135deg, #007AFF 0%, #FF4F28 100%);
  }
}
:root[data-theme="light"]{
  --bg: #EDF2F8;
  --card: rgba(255, 255, 255, 0.60);
  --card-sub: rgba(255, 255, 255, 0.58);
  --modal-bg: rgba(248, 250, 254, 0.84);
  --tx: #0F172A;
  --mut: #5A657A;
  --ac: #007AFF;
  --ac-2: #FF4F28;
  --ac-light: rgba(0, 122, 255, 0.14);
  --bd: rgba(15, 23, 42, 0.09);
  --bd-top: rgba(255, 255, 255, 0.92);
  --bad: #FF3B30;
  --bad-light: rgba(255, 59, 48, 0.14);
  --jm: #16A34A;
  --jm-light: rgba(22, 163, 74, 0.14);
  --sh: 0 14px 36px -8px rgba(15, 23, 42, 0.10), inset 0 1.5px 0 0 var(--bd-top);
  --sh-sm: 0 4px 12px rgba(15, 23, 42, 0.06), inset 0 1px 0 0 rgba(255, 255, 255, 0.85);
  --grad: linear-gradient(135deg, #007AFF 0%, #FF4F28 100%);
}

*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}

/* Apple Duo Fluid Background Canvas */
#bg-anim {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
  background: var(--bg);
  transition: background .4s ease;
}

body{
  margin:0 auto;
  background:transparent;
  color:var(--tx);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Hind Siliguri', system-ui, sans-serif;
  padding:14px;
  max-width:620px;
  -webkit-font-smoothing:antialiased;
  position: relative;
  z-index: 1;
}

/* Apple Style Splash Screen */
#splash{
  position:fixed;inset:0;z-index:9999;
  background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--tx);transition:opacity .5s var(--spring),visibility .5s
}
#splash.hide{opacity:0;visibility:hidden}
#splash .logo{
  width:84px;height:84px;border-radius:24px;
  background:var(--grad);
  display:flex;align-items:center;justify-content:center;
  font-size:34px;font-weight:800;color:#fff;letter-spacing:-1px;
  box-shadow:0 16px 40px rgba(10, 132, 255, 0.35), inset 0 1.5px 0 rgba(255,255,255,0.45);
  animation:appleFloat 1.6s ease-in-out infinite;
}
#splash h1{margin:16px 0 4px;font-size:26px;font-weight:700;letter-spacing:-0.6px;}
#splash p{margin:0;opacity:.75;font-size:14px}
#splash .bar{margin-top:24px;width:160px;height:5px;border-radius:99px;background:var(--card-sub);overflow:hidden;border:1px solid var(--bd);}
#splash .bar i{display:block;height:100%;width:45%;background:var(--grad);border-radius:99px;animation:load 1.2s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@keyframes appleFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.03)}}

#offbar{
  position:fixed;top:0;left:0;right:0;
  background:var(--bad);color:#fff;text-align:center;
  font-size:12.5px;font-weight:600;padding:5px;z-index:1000;
  transform:translateY(-100%);transition:transform .3s var(--spring);
}
#offbar.show{transform:translateY(0)}

/* Apple Floating Liquid Glass Top Bar */
.top-bar{
  position:sticky;top:8px;z-index:20;
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 12px;margin:0 0 16px;
  background:var(--card);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  color:var(--tx);transition:all .3s var(--spring);
  gap:8px;border:1px solid var(--bd);border-radius:999px;
  box-shadow:var(--sh);
}
.top-bar::before{
  content:'Stock Register';
  font-size:14px;font-weight:700;letter-spacing:-0.3px;
  padding-left:8px;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.top-bar.shrink{top:4px;padding:6px 10px;}
.top-bar .right{display:flex;align-items:center;gap:8px}

.theme-btn{
  background:var(--card-sub);border:1px solid var(--bd);color:var(--tx);
  font-weight:600;font-size:15px;padding:7px 11px;border-radius:999px;
  cursor:pointer;line-height:1;box-shadow:var(--sh-sm);
  transition:transform .2s var(--spring), background .2s;
}
.theme-btn:active{transform:scale(0.92);}

.net-status{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 12px;border-radius:999px;
  background:var(--card-sub);border:1px solid var(--bd);
  font-size:12px;font-weight:600;box-shadow:var(--sh-sm);
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--jm);animation:pulse 2s infinite}
.dot.off{background:#FF9F0A;animation:none;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(48,209,88,.45)}70%{box-shadow:0 0 0 6px rgba(48,209,88,0)}100%{box-shadow:0 0 0 0 rgba(48,209,88,0)}}

/* Liquid Glass Cards */
.card{
  background:var(--card);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--bd);
  border-radius:var(--radius);
  padding:20px;margin-bottom:16px;
  box-shadow:var(--sh);
  animation:fadeUp .42s var(--spring) both;
  position:relative;overflow:hidden;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px) scale(0.985)}to{opacity:1;transform:translateY(0) scale(1)}}

label{font-size:13px;font-weight:600;color:var(--mut);display:block;margin:14px 0 6px}
select,input{
  width:100%;font-size:15px;font-family:inherit;padding:13px 14px;
  border:1px solid var(--bd);border-radius:14px;
  background:var(--card-sub);color:var(--tx);outline:none;
  transition:border-color .2s,box-shadow .2s,background .2s;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:inset 0 1px 2px rgba(0,0,0,0.06);
}
select:focus,input:focus{
  border-color:var(--ac);
  background:var(--card);
  box-shadow:0 0 0 3.5px var(--ac-light);
}
.row{display:flex;gap:12px}.row>*{flex:1}

/* HOME GRID - Apple Glass Tiles */
.home-grid{display:flex;flex-direction:column;gap:13px;margin-bottom:20px;margin-top:4px}
.tile{
  background:var(--card);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--bd);
  border-radius:24px;
  padding:20px 20px;
  display:flex;flex-direction:row;align-items:center;justify-content:space-between;
  cursor:pointer;box-shadow:var(--sh);
  transition:transform .25s var(--spring), box-shadow .25s var(--spring), border-color .25s;
  position:relative;overflow:hidden;user-select:none;
}
.tile::before{
  content:'';position:absolute;left:10px;top:16px;bottom:16px;width:5px;border-radius:99px;
  background:var(--tileColor,var(--ac));
  box-shadow:0 0 16px var(--tileColor,var(--ac));
}
.tile::after{
  content:'';position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;
  background:radial-gradient(circle, var(--tileColor,var(--ac)) 0%, transparent 70%);
  opacity:0.14;pointer-events:none;transition:transform .3s var(--spring), opacity .3s;
}
.tile:active{transform:scale(0.975);box-shadow:var(--sh-sm);}
.tile:hover{transform:translateY(-2px);border-color:var(--bd-top);}
.tile:hover::after{transform:scale(1.25);opacity:0.22;}
.tile .t-content{display:flex;flex-direction:column;gap:4px;padding-left:16px;}
.tile .tname{font-size:18.5px;font-weight:700;color:var(--tx);letter-spacing:-0.35px;}
.tile .tsub{font-size:13px;color:var(--mut);font-weight:500;}
.tile .arrow{
  width:34px;height:34px;border-radius:50%;
  background:var(--card-sub);border:1px solid var(--bd);
  display:flex;align-items:center;justify-content:center;
  color:var(--tx);font-size:18px;font-weight:600;
  box-shadow:var(--sh-sm);transition:transform .25s var(--spring);
}
.tile:hover .arrow{transform:translateX(3px);}

/* Fresh Apple Duo-Harmonized Tile Colors */
.tile[data-color="1"]{--tileColor:#0A84FF}
.tile[data-color="2"]{--tileColor:#FF5E3A}
.tile[data-color="3"]{--tileColor:#30D158}
.tile[data-color="4"]{--tileColor:#FF9F0A}
.tile[data-color="5"]{--tileColor:#00C7BE}
.tile[data-color="6"]{--tileColor:#FF375F}
.tile[data-color="7"]{--tileColor:#32ADE6}
.tile[data-color="8"]{--tileColor:#FF6B4A}

.page-wrap{display:none}
.page-wrap.on{display:block;animation:fadeUp .35s var(--spring)}
.page-back{
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 18px;background:var(--card);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--bd);border-radius:999px;
  font-size:14px;font-weight:600;color:var(--tx);cursor:pointer;
  margin-bottom:14px;box-shadow:var(--sh-sm);transition:transform .2s var(--spring);
}
.page-back:active{transform:scale(0.94);}
.page-title{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:800;margin:0 0 16px;color:var(--tx);letter-spacing:-0.7px;}

/* Liquid Glass Buttons */
button{
  font-family:inherit;font-size:15px;font-weight:600;padding:13px 16px;
  border:1px solid var(--bd);border-radius:14px;
  background:var(--card-sub);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  color:var(--tx);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  user-select:none;transition:transform .2s var(--spring), background .2s, box-shadow .2s;
  box-shadow:var(--sh-sm);
}
button:active{transform:scale(0.95);}
button.on{
  background:var(--ac);color:#fff;border-color:transparent;
  box-shadow:0 6px 18px rgba(10, 132, 255, 0.35), inset 0 1px 0 rgba(255,255,255,0.35);
  font-weight:700;
}

.big{
  width:100%;background:var(--grad);color:#fff!important;border:none;
  font-size:16px;font-weight:700;padding:15px;border-radius:16px;
  box-shadow:0 10px 26px -4px rgba(10, 132, 255, 0.35), inset 0 1.5px 0 rgba(255,255,255,0.38);
  margin-top:18px;letter-spacing:-0.2px;
}
.big:active{transform:scale(0.975);box-shadow:0 4px 12px rgba(10, 132, 255, 0.25);}
.big.success{background:linear-gradient(135deg,#30D158,#059669)!important;box-shadow:0 8px 22px rgba(48, 209, 88, 0.35), inset 0 1px 0 rgba(255,255,255,0.35);}

.sub{color:var(--mut);font-size:13.5px;line-height:1.5;}
.res{color:var(--tx);font-weight:700;font-size:22px;margin-top:12px;letter-spacing:-0.4px;}
h2{font-size:18px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px;letter-spacing:-0.35px;}

.wrap{
  overflow-x:auto;border-radius:16px;border:1px solid var(--bd);
  background:var(--card-sub);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
table{width:100%;border-collapse:collapse;font-size:14.5px;}
th{background:rgba(128,128,128,0.08);color:var(--mut);font-weight:600;font-size:12.5px;padding:13px 12px;border-bottom:1px solid var(--bd);text-align:left;}
th:nth-child(n+3){text-align:right;}
td{padding:12px;border-bottom:1px solid var(--bd);vertical-align:middle;font-variant-numeric:tabular-nums;font-weight:500;}
td:nth-child(n+3){text-align:right;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(128,128,128,0.06)}

.x{color:var(--bad);background:var(--bad-light);border:1px solid rgba(255,69,58,0.28);border-radius:10px;padding:6px 12px;font-weight:600;font-size:13px;}
.dt{font-size:12.5px;padding:7px 13px;margin-top:8px;border-radius:10px;background:var(--card-sub);border:1px solid var(--bd);font-weight:600;}
#ms{color:var(--ac);font-weight:600;font-size:14px;min-height:20px;margin-top:12px;text-align:center;}

details{
  border:1px solid var(--bd);border-radius:var(--radius);padding:18px;
  background:var(--card);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  box-shadow:var(--sh);margin-bottom:16px;
}
details summary{font-size:16px;font-weight:600;cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;}
details summary::after{content:'+';font-size:22px;font-weight:500;color:var(--ac)}
details[open] summary::after{content:'−'}

/* Glass Modals */
.modal-wrap{
  position:fixed;inset:0;background:rgba(0,0,0,0.48);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  z-index:40;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));
  overflow-y:auto;display:flex;align-items:center;justify-content:center;
  animation:backdropIn .22s ease;
}
@keyframes backdropIn{from{opacity:0}to{opacity:1}}
.modal-wrap>.card{
  width:100%;
  animation:modalIn .32s var(--spring);
  background:var(--modal-bg);
  backdrop-filter:blur(36px) saturate(200%);-webkit-backdrop-filter:blur(36px) saturate(200%);
}
@keyframes modalIn{from{opacity:0;transform:scale(.94) translateY(14px)}to{opacity:1;transform:scale(1) translateY(0)}}

#hd{align-items:flex-start;padding-top:calc(24px + env(safe-area-inset-top,0px))}
#hd .card{max-height:90vh;display:flex;flex-direction:column;overflow:hidden;margin:0 auto}
#hd .card > .row:first-child,
#hd .card > #hds,
#hd .card > .row:nth-of-type(2),
#hd .card > .row:nth-of-type(3),
#hd .card > label,
#hd .card > input,
#hd .card > #hdp,
#hd .card > #hdv,
#hd .card > #hdpdf,
#hd .card > #hdpmsg{flex:0 0 auto}
#hd .card > .wrap{margin-top:12px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0}

#dday{align-items:flex-start;padding-top:calc(24px + env(safe-area-inset-top,0px))}
#dday .card{max-height:90vh;display:flex;flex-direction:column;overflow:hidden;margin:0 auto;padding:18px}
#dday .dhead{flex:0 0 auto}
#dday .dbody{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-top:12px;padding-right:2px}
#dday .dbody .wrap{overflow:visible;border-radius:14px;border:1px solid var(--bd)}
#dday .dfoot{flex:0 0 auto;margin-top:16px}

.prod-pick-item{
  padding:15px 16px;border:1px solid var(--bd);border-radius:16px;
  background:var(--card-sub);cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;
  user-select:none;transition:transform .15s var(--spring), background .15s;
  margin-bottom:4px;box-shadow:var(--sh-sm);
}
.prod-pick-item:active{background:var(--ac-light);transform:scale(0.98);}

.empty{display:flex;flex-direction:column;align-items:center;padding:32px 16px;gap:12px;color:var(--mut)}
.empty .etxt{font-size:15px;font-weight:500;text-align:center;}

#toast{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(30px);
  background:var(--modal-bg);color:var(--tx);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--bd-top);
  padding:13px 22px;border-radius:999px;
  font-size:14px;font-weight:700;
  box-shadow:0 14px 34px rgba(0,0,0,0.32);
  z-index:9998;opacity:0;pointer-events:none;
  transition:opacity .3s,transform .35s var(--spring);
  display:flex;align-items:center;gap:8px;max-width:90%;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{background:var(--bad);color:#fff;border-color:rgba(255,255,255,0.25);box-shadow:0 10px 26px rgba(255, 69, 58, 0.4);}

.dsum{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.dsum .box{background:var(--card-sub);border:1px solid var(--bd);border-radius:16px;padding:14px;text-align:center;box-shadow:var(--sh-sm);}
.dsum .box .lbl{font-size:12px;color:var(--mut);font-weight:600;}
.dsum .box .val{font-size:20px;color:var(--tx);font-weight:700;margin-top:6px;}
.dsum .box .val.bad{color:var(--bad)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<canvas id="bg-anim"></canvas>

<div id="splash">
  <div class="logo">SR</div>
  <h1>Stock Register</h1>
  <p>Loading your data…</p>
  <div class="bar"><i></i></div>
</div>

<div id="offbar">OFFLINE MODE — DATA LOCAL E SAVE HOBE</div>
<div id="toast"></div>

<div class="top-bar" id="topBar">
  <div class="right">
    <div class="net-status"><span id="netDot" class="dot"></span><span id="netTx">Online</span></div>
    <button class="theme-btn" id="themeBtn" title="Theme">🌙</button>
  </div>
</div>

<!-- ================= HOME ================= -->
<div class="page-wrap on" id="pgHome">
  <div class="home-grid">
    <div class="tile" data-color="1" data-page="0">
      <div class="t-content">
        <div class="tname">Entry</div>
        <div class="tsub">Stock jog koro</div>
      </div>
      <div class="arrow">›</div>
    </div>
    <div class="tile" data-color="2" data-page="1">
      <div class="t-content">
        <div class="tname">Stock</div>
        <div class="tsub">Stock dekho & PDF</div>
      </div>
      <div class="arrow">›</div>
